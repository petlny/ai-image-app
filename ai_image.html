<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 图片生成</title>
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #f5f5f5; margin: 0; padding: 16px; }
    .container { max-width: 480px; margin: 0 auto; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { font-size: 1.4em; margin: 0 0 20px; text-align: center; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
    button { width: 100%; padding: 14px; background: #007AFF; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    button:disabled { background: #aaa; }
    .result { margin-top: 20px; }
    .result img { width: 100%; border-radius: 8px; margin-bottom: 12px; }
    .status { text-align: center; margin: 12px 0; color: #888; }
    .file-label { display: inline-block; background: #34c759; color: white; padding: 10px 16px; border-radius: 8px; margin-top: 8px; cursor: pointer; }
    #fileInput { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ AI 图片编辑</h1>
    <form id="mainForm">
      <label>生成 API Key</label>
      <input type="password" name="api_key" id="api_key" placeholder="输入 AI 生成服务的 Key" required>

      <label>图床 API Key</label>
      <input type="password" name="imgur_key" id="imgur_key" placeholder="输入 imgur.la 的 Key" required>

      <label>提示词</label>
      <textarea name="prompt" id="prompt" rows="3" placeholder="描述你想要的图片内容" required></textarea>

      <label>输出比例</label>
      <select name="size" id="size">
        <option value="auto">自动</option>
        <option value="1:1">1:1</option>
        <option value="16:9">16:9</option>
        <option value="9:16">9:16</option>
        <option value="3:2">3:2</option>
      </select>

      <label>生成数量</label>
      <select name="count" id="count">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>

      <label>上传图片（可选）</label>
      <label class="file-label" for="fileInput">点击选择图片</label>
      <input type="file" id="fileInput" accept="image/*">
      <span id="fileName" style="margin-left:10px; color:#666;"></span>

      <button type="submit" id="submitBtn">开始生成</button>
    </form>

    <div class="status" id="status"></div>
    <div class="result" id="result"></div>
  </div>

  <script>
    const form = document.getElementById('mainForm');
    const statusDiv = document.getElementById('status');
    const resultDiv = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');

    const IMGUR_API = 'https://imgur.la/api/1/upload';
    const CREATE_API = 'https://api.wuyinkeji.com/api/async/image_gpt';
    const DETAIL_API = 'https://api.wuyinkeji.com/api/async/detail';

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        fileName.textContent = e.target.files[0].name;
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      statusDiv.textContent = '启动中...';
      resultDiv.innerHTML = '';

      const apiKey = document.getElementById('api_key').value.trim();
      const imgurKey = document.getElementById('imgur_key').value.trim();
      const prompt = document.getElementById('prompt').value.trim();
      const size = document.getElementById('size').value;
      const count = parseInt(document.getElementById('count').value);
      const file = fileInput.files[0];

      try {
        let imageUrl = null;
        if (file) {
          statusDiv.textContent = '压缩并上传图片...';
          const compressed = await compressImage(file);
          imageUrl = await uploadToImgur(compressed, imgurKey);
        }

        statusDiv.textContent = '创建生成任务...';
        const taskId = await createTask(apiKey, prompt, size, count, imageUrl);

        statusDiv.textContent = '任务已创建，等待结果...';
        const urls = await pollTask(apiKey, taskId);
        statusDiv.textContent = '生成完成！';
        displayImages(urls);
      } catch (err) {
        statusDiv.textContent = '错误: ' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });

    async function compressImage(file) {
      const img = await createImageBitmap(file);
      const canvas = document.createElement('canvas');
      const maxWidth = 1200;
      let width = img.width;
      let height = img.height;
      if (width > maxWidth) {
        height = Math.round((maxWidth / width) * height);
        width = maxWidth;
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
    }

    async function uploadToImgur(blob, imgurKey) {
      const formData = new FormData();
      formData.append('source', blob, 'upload.png');
      const resp = await fetch(IMGUR_API, {
        method: 'POST',
        headers: { 'X-API-Key': imgurKey },
        body: formData
      });
      const data = await resp.json();
      if (data.status_code !== 200) throw new Error('图床上传失败');
      return data.image.url || data.image.display_url || Object.values(data.image).find(v => typeof v === 'string' && v.startsWith('http'));
    }

    async function createTask(apiKey, prompt, size, count, imageUrl) {
      const payload = { prompt, size, count };
      if (imageUrl) payload.urls = [imageUrl];
      const resp = await fetch(CREATE_API, {
        method: 'POST',
        headers: { 'Authorization': apiKey, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await resp.json();
      if (data.code !== 200) throw new Error('创建任务失败');
      return data.data.id;
    }

    async function pollTask(apiKey, taskId) {
      for (let i = 0; i < 60; i++) {
        await new Promise(r => setTimeout(r, 5000));
        const resp = await fetch(DETAIL_API + '?id=' + taskId, {
          headers: { 'Authorization': apiKey }
        });
        const data = await resp.json();
        if (data.code !== 200) continue;
        const status = data.data.status;
        if (status === 2) {
          const urls = [];
          const possible = ['url', 'image_url', 'result_url', 'src'];
          const d = data.data;
          for (const key of possible) {
            if (typeof d[key] === 'string' && d[key].startsWith('http')) urls.push(d[key]);
          }
          if (d.urls && Array.isArray(d.urls)) {
            d.urls.forEach(item => {
              if (typeof item === 'string' && item.startsWith('http')) urls.push(item);
              else if (item && typeof item === 'object') {
                for (const key of possible) {
                  if (typeof item[key] === 'string' && item[key].startsWith('http')) urls.push(item[key]);
                }
              }
            });
          }
          return [...new Set(urls)];
        } else if (status === 3) {
          throw new Error('生成任务失败');
        }
        statusDiv.textContent = `轮询中... (${i+1}/60)`;
      }
      throw new Error('轮询超时');
    }

    function displayImages(urls) {
      resultDiv.innerHTML = '';
      urls.forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        img.alt = '生成的图片';
        resultDiv.appendChild(img);
      });
    }
  </script>
</body>
</html>
